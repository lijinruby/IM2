<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project — ALEK Consultants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="role-loading">
    <div class="shell">
        <nav class="sidebar shadow" id="sidebar">
            <div class="brand p-3 d-flex align-items-center gap-3 border-bottom border-white border-opacity-10" style="height:70px">
                <div class="brand-mark ms-1">A</div>
                <span class="brand-name text-white fw-bold fs-5 text-nowrap">ALEK Consultants</span>
            </div>
            <div class="mt-4 flex-grow-1">
                <a href="dashboard.html" class="nav-item-custom"><i class="bi bi-grid-1x2"></i> <span class="nav-text">Dashboard</span></a>
                <a href="clients.html" class="nav-item-custom" data-role="admin"><i class="bi bi-people"></i> <span class="nav-text">Clients</span></a>
                <a href="projects.html" class="nav-item-custom active" data-role="admin"><i class="bi bi-kanban"></i> <span class="nav-text">Projects</span></a>
                <a href="payments.html" class="nav-item-custom" data-role="admin"><i class="bi bi-credit-card"></i> <span class="nav-text">Payments</span></a>
                <a href="billing.html" class="nav-item-custom"><i class="bi bi-file-earmark-text"></i> <span class="nav-text">Billing</span></a>
            </div>
            <div class="p-3 border-top border-white border-opacity-10">
                <a href="#" onclick="logout()" class="nav-item-custom"><i class="bi bi-box-arrow-left"></i> <span class="nav-text">Logout</span></a>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar px-4">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light border btn-sm me-3" id="sidebarToggle"><i class="bi bi-list fs-5"></i></button>
                    <h6 class="mb-0 fw-bold">New Project</h6>
                </div>
                <div class="badge rounded-pill bg-success px-3 py-2 text-uppercase" id="userRoleBadge">Loading...</div>
            </header>

            <main class="p-4 container-fluid">
                <div class="welcome-header shadow-sm border-0 mb-4">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h2 class="fw-bold mb-2">Create Project</h2>
                            <p class="opacity-75 mb-0">Assign a project to a client and a project manager.</p>
                        </div>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card border-0 shadow-sm p-4 p-lg-5" style="border-radius: 16px;">
                            <h5 class="fw-bold mb-4 text-navy">Project Details</h5>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="project-name" placeholder="Project Name">
                                <label for="project-name">Project Name</label>
                            </div>

                            <div class="form-floating mb-3">
                                <select class="form-select" id="project-client">
                                    <option value="">Loading clients...</option>
                                </select>
                                <label for="project-client">Client</label>
                            </div>

                            <div class="form-floating mb-3">
                                <select class="form-select" id="project-pm">
                                    <option value="">Loading project managers...</option>
                                </select>
                                <label for="project-pm">Project Manager</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="project-amount" placeholder="0.00">
                                <label for="project-amount">Contract Amount (PHP)</label>
                            </div>

                            <div class="form-floating mb-4">
                                <select class="form-select" id="project-status">
                                    <option value="ongoing" selected>Ongoing</option>
                                    <option value="on_hold">On Hold</option>
                                    <option value="completed">Completed</option>
                                </select>
                                <label for="project-status">Status</label>
                            </div>

                            <div class="d-flex gap-3 mt-2">
                                <button onclick="createProject()" id="submit-btn" class="btn btn-amber py-3 flex-grow-1 shadow-sm">
                                    Create Project
                                </button>
                                <a href="projects.html" class="btn btn-light py-3 border px-4">Cancel</a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script>
        async function loadFormOptions() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const role = await getCurrentRole();

            const { data: clients } = await supabase.from('clients').select('id, name');
            const clientSelect = document.getElementById('project-client');
            clientSelect.innerHTML = '<option value="" selected disabled>-- Choose a Client --</option>';
            (clients || []).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                clientSelect.appendChild(opt);
            });

            const pmSelect = document.getElementById('project-pm');
            const pmFieldLabel = document.querySelector('label[for="project-pm"]');

            if (role === 'pm') {
                // Project ownership: a PM creates projects assigned to themselves,
                // not to whichever PM they choose from a list.
                const { data: profile } = await supabase.from('profiles').select('full_name').eq('id', user.id).single();
                pmSelect.innerHTML = `<option value="${user.id}" selected>${profile?.full_name || 'You'} (you)</option>`;
                pmSelect.disabled = true;
                if (pmFieldLabel) pmFieldLabel.innerText = 'Project Manager (you)';
            } else {
                // Admin/oversight view: can still assign any PM if needed.
                const { data: pms } = await supabase.from('profiles').select('id, full_name').eq('role', 'pm');
                pmSelect.innerHTML = '<option value="">-- Unassigned --</option>';
                (pms || []).forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.full_name || p.id;
                    pmSelect.appendChild(opt);
                });
            }
        }

        async function createProject() {
            const role = await getCurrentRole();
            if (role !== 'pm') {
                alert('Only Project Managers can create new projects.');
                window.location.href = 'projects.html';
                return;
            }

            const name = document.getElementById('project-name').value.trim();
            const clientId = document.getElementById('project-client').value;
            const pmId = document.getElementById('project-pm').value || null;
            const amount = document.getElementById('project-amount').value || 0;
            const status = document.getElementById('project-status').value;

            if (!name || !clientId) {
                alert("Please provide a project name and select a client.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="spinner-border spinner-border-sm me-2"></div> Creating...';
            btn.disabled = true;

            const { error } = await supabase.from('projects').insert([{
                name,
                client_id: clientId,
                pm_id: pmId,
                contract_amount: parseFloat(amount) || 0,
                status
            }]);

            if (error) {
                alert("Error: " + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            } else {
                alert("Project created successfully!");
                window.location.href = 'projects.html';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!await enforceRole(['pm'], 'projects.html')) return;
            await loadFormOptions();
        });
        // Sidebar toggle is wired once in auth.js (initSidebar) — do not duplicate it here.
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login — ALEK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body class="auth-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-9 col-lg-8 col-xl-7">
                <div class="card auth-card shadow-lg border-0" style="max-width: 100%;">
                    <div class="card-body">
                        <div class="auth-header">
                            <div class="brand-logo">A</div>
                            <h4 class="fw-bold">Consultant Portal</h4>
                            <p>Secure access for ALEK Consultants project and billing workflows.</p>
                        </div>

                        <div id="auth-message" class="alert d-none"></div>

                        <div class="mb-3">
                            <label for="email-input" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email-input" placeholder="name@example.com">
                        </div>

                        <div class="mb-3 position-relative">
                            <label for="password-input" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password-input" placeholder="Password">
                            <button id="togglePassword" class="btn btn-sm btn-light position-absolute" type="button" style="right:14px;top:38px;border:none;padding:8px;border-radius:12px;">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check mb-0">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            <a href="signup.html" class="text-decoration-none">Request access</a>
                        </div>

                        <button onclick="login()" id="loginBtn" class="btn btn-amber w-100 fw-bold">
                            Sign In <i class="bi bi-arrow-right ms-2"></i>
                        </button>

                        <div class="auth-footer mt-4">
                            <span class="text-muted">Need help? Contact your system administrator.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/auth.js?v=2"></script>
</body>
</html>

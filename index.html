<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal Login — ALEK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card border-0 shadow-lg p-4 rounded-4" style="position:relative;">
                    <div style="height: 4px; background: var(--amber); width: 100%; position: absolute; top: 0; left: 0; border-radius: 4px 4px 0 0;"></div>

                    <div class="text-center mb-4 mt-2">
                        <div class="brand-logo mx-auto mb-3" style="width:45px; height:45px; font-size: 22px;">A</div>
                        <h4 class="fw-bold">Consultant Portal</h4>
                        <p class="text-muted small">Enter your credentials to manage billings</p>
                    </div>

                    <div id="auth-message" class="alert d-none"></div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email-input" placeholder="name@example.com">
                        <label for="email-input">Email address</label>
                    </div>
                    <div class="form-floating mb-2 position-relative">
                        <input type="password" class="form-control" id="password-input" placeholder="Password">
                        <label for="password-input">Password</label>
                        <button id="togglePassword" class="btn btn-sm btn-light position-absolute" type="button" style="right:12px;top:10px;border:none;padding:6px;border-radius:8px;">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="d-flex align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                        </div>
                    </div>

                    <button onclick="login()" id="loginBtn" class="btn btn-amber w-100 py-3 fw-bold rounded-3">
                        Sign In <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                    <div class="text-center mt-4">
                        <a href="signup.html" class="text-decoration-none small text-muted">Request system access →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>

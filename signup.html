<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ALEK Consultants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-bg">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-9 col-lg-8 col-xl-7">
                <div class="card auth-card shadow-lg border-0" style="max-width: 100%;">
                    <div class="card-body">
                        <div class="auth-header">
                            <div class="brand-logo">A</div>
                            <h4 class="fw-bold text-dark">Create Account</h4>
                            <p>Register to request system access and manage billing workflows.</p>
                        </div>

                        <div id="auth-message" class="alert d-none mb-4" role="alert"></div>

                        <div class="mb-3">
                            <label for="signup-name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="signup-name" placeholder="John Doe" required>
                        </div>

                        <div class="mb-3">
                            <label for="signup-role" class="form-label">System Role</label>
                            <select class="form-select" id="signup-role">
                                <option value="client" selected>Client / Partner</option>
                                <option value="pm">Project Manager</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="signup-email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="signup-email" placeholder="name@company.com" required>
                        </div>

                        <div class="mb-4 position-relative">
                            <label for="signup-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="signup-password" placeholder="Password" required>
                            <button id="toggleSignupPassword" class="btn btn-sm btn-light position-absolute" type="button" style="right:14px;top:38px;border:none;padding:8px;border-radius:12px;">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <button onclick="signUp()" id="signupBtn" class="btn btn-amber w-100 fw-bold">
                            Register Account <i class="fa-solid fa-chevron-right ms-2"></i>
                        </button>

                        <div class="auth-footer mt-4">
                            <p class="small text-muted mb-0">Already have an account? <a href="index.html" class="text-decoration-none">Sign In</a></p>
                        </div>
                    </div>
                </div>

                <p class="text-center text-white-50 mt-4 small">
                    &copy; 2026 ALEK Consultants. All rights reserved.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/auth.js?v=2"></script>
</body>
</html>
